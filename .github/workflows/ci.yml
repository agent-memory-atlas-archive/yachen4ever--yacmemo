name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # 前端：先构建，产物落 yacmemo/webui/dist/，WebUI 测试才能拿到 /ui/ 200
      - name: Build WebUI frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # 后端：安装 + lint + 全量测试
      - name: Install Python deps
        run: |
          uv python install 3.12
          uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest
