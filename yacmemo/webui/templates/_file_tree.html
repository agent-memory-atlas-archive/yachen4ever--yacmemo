{% macro render_tree(items) %}
{% for item in items %}
<div class="tree-item">
    {% if item.type == 'dir' %}
    <div class="tree-dir" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'block' : 'none'">
        📁 {{ item.name }}/
    </div>
    <div style="display: block;">
        {{ render_tree(item.children) }}
    </div>
    {% else %}
    <div class="tree-file" onclick="loadFile('{{ item.path }}')">
        📄 {{ item.name }}
    </div>
    {% endif %}
</div>
{% endfor %}
{% endmacro %}
{{ render_tree(file_tree) }}
