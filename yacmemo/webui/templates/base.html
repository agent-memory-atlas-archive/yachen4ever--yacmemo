<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}yacmemo{% endblock %}</title>
    <style>
        :root {
            --bg: #0f1117; --surface: #1a1d27; --border: #2a2d3a;
            --text: #e0e0e0; --text-dim: #888; --accent: #6c8eff;
            --green: #4caf50; --red: #f44336; --yellow: #ffc107;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg); color: var(--text);
            display: flex; min-height: 100vh;
        }
        nav {
            width: 200px; background: var(--surface); padding: 20px 0;
            border-right: 1px solid var(--border); flex-shrink: 0;
        }
        nav .logo { font-size: 18px; font-weight: 700; padding: 0 20px 20px; color: var(--accent); }
        nav a {
            display: block; padding: 10px 20px; color: var(--text-dim);
            text-decoration: none; font-size: 14px; transition: all 0.2s;
        }
        nav a:hover, nav a.active { color: var(--text); background: rgba(108,142,255,0.1); }
        main { flex: 1; padding: 24px; overflow-x: auto; }
        h1 { font-size: 22px; margin-bottom: 20px; }
        h2 { font-size: 16px; margin: 20px 0 10px; color: var(--text-dim); }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px; }
        th { color: var(--text-dim); font-weight: 600; }
        tr:hover { background: rgba(255,255,255,0.03); }
        .card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 8px; padding: 16px; margin-bottom: 16px;
        }
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .stat-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 8px; padding: 16px; text-align: center;
        }
        .stat-card .num { font-size: 28px; font-weight: 700; color: var(--accent); }
        .stat-card .label { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
        .badge { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
        .badge-green { background: rgba(76,175,80,0.2); color: var(--green); }
        .badge-red { background: rgba(244,67,54,0.2); color: var(--red); }
        .badge-yellow { background: rgba(255,193,7,0.2); color: var(--yellow); }
        input, textarea, button {
            background: var(--surface); border: 1px solid var(--border);
            color: var(--text); padding: 8px 12px; border-radius: 6px; font-size: 14px;
        }
        button { cursor: pointer; background: var(--accent); color: #fff; border: none; padding: 8px 16px; }
        button:hover { opacity: 0.85; }
        button.secondary { background: var(--surface); border: 1px solid var(--border); }
        input[type="text"], input[type="password"], textarea { width: 100%; max-width: 500px; }
        .tree-item { padding-left: 20px; }
        .tree-dir { cursor: pointer; user-select: none; }
        .tree-file { color: var(--accent); cursor: pointer; }
        pre { background: var(--bg); padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 13px; line-height: 1.5; }
        .search-result { padding: 8px 0; border-bottom: 1px solid var(--border); }
        .search-result .title { color: var(--accent); font-size: 14px; }
        .search-result .meta { color: var(--text-dim); font-size: 12px; }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
        .flex { display: flex; gap: 12px; align-items: center; }
        .ml-auto { margin-left: auto; }
    </style>
</head>
<body>
    <nav>
        <div class="logo">yacmemo</div>
        <a href="/admin/" class="{% block nav_dashboard %}{% endblock %}">仪表盘</a>
        <a href="/admin/users" class="{% block nav_users %}{% endblock %}">用户管理</a>
        {% for u in users if users %}
        <a href="/admin/memory/{{ u.id }}" class="{% block nav_memory %}{% endblock %}">记忆 · {{ u.display_name or u.id }}</a>
        {% endfor %}
        {% for u in users if users %}
        <a href="/admin/search/{{ u.id }}" class="{% block nav_search %}{% endblock %}">搜索 · {{ u.display_name or u.id }}</a>
        {% endfor %}
        {% for u in users if users %}
        <a href="/admin/consistency/{{ u.id }}" class="{% block nav_consistency %}{% endblock %}">校验 · {{ u.display_name or u.id }}</a>
        {% endfor %}
        <a href="/admin/status" class="{% block nav_status %}{% endblock %}">系统状态</a>
        <a href="/admin/logout">退出</a>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
