{% extends "base.html" %}
{% block title %}搜索 - {{ user.display_name }}{% endblock %}
{% block nav_search %}active{% endblock %}
{% block content %}
<h1>搜索 · {{ user.display_name }}</h1>

<div style="margin-bottom: 20px;">
    <h2>语义搜索</h2>
    <div class="flex">
        <input type="text" id="search-query" placeholder="输入查询文本..." style="flex: 1; max-width: 600px;">
        <button onclick="doSearch()">搜索</button>
    </div>
</div>

<div id="search-results"></div>

<div style="margin-bottom: 20px; margin-top: 40px;">
    <h2>正则搜索 (grep)</h2>
    <div class="flex">
        <input type="text" id="grep-pattern" placeholder="输入正则表达式..." style="flex: 1; max-width: 600px;">
        <button onclick="doGrep()">搜索</button>
    </div>
</div>

<pre id="grep-results" style="display:none;"></pre>

<script>
async function doSearch() {
    const query = document.getElementById('search-query').value;
    if (!query) return;
    const formData = new FormData();
    formData.append('query', query);
    formData.append('limit', '10');
    const resp = await fetch(`/admin/api/search/{{ user.id }}`, { method: 'POST', body: formData });
    const data = await resp.json();
    const results = data.results || [];
    const container = document.getElementById('search-results');

    if (data.error) {
        container.innerHTML = `<div class="card"><p style="color: var(--red)">${data.error}</p></div>`;
        return;
    }

    if (results.length === 0) {
        container.innerHTML = '<div class="card"><p>未找到相关记忆。</p></div>';
        return;
    }

    let html = '<div class="card">';
    for (let i = 0; i < results.length; i++) {
        const r = results[i];
        const dist = r._distance ? r._distance.toFixed(4) : '-';
        html += `<div class="search-result">
            <div class="title">${i+1}. [${r.kind || '?'}] ${r.text || ''}</div>
            <div class="meta">source: ${r.source_path || ''} | distance: ${dist}</div>
        </div>`;
    }
    html += '</div>';
    container.innerHTML = html;
}

async function doGrep() {
    const pattern = document.getElementById('grep-pattern').value;
    if (!pattern) return;
    const formData = new FormData();
    formData.append('pattern', pattern);
    const resp = await fetch(`/admin/api/grep/{{ user.id }}`, { method: 'POST', body: formData });
    const data = await resp.json();
    const el = document.getElementById('grep-results');
    el.style.display = 'block';
    el.textContent = data.matches || data.error || '(no output)';
}
</script>
{% endblock %}
