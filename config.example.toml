# yacmemo v2 (lean) example configuration
# Copy to config.toml and edit values for your environment.
# Everything is optional — missing keys fall back to the defaults shown here.

[memory]
# Root for `yacmemo-mcp` (single-user stdio mode). Ignored by `yacmemo-server`,
# which uses the [[users]] roots below.
root = "memory"
# Timeline notes live here; exempt from the near-duplicate title guard.
journal_dir = "journal"
# Per-mutation git snapshots: every write/edit/move/delete/topic change
# auto-commits ("memory repo is always git-clean"). Auto-inits the repo on
# first write; set false to disable (degrades to no-op, never blocks writes).
git_snapshots = true

[embedding]
# OpenAI-compatible /v1/embeddings endpoint (omlx + Qwen3-Embedding).
base_url = "http://m2ultra:11235/v1"
api_key = "sk-your-key"
model = "Qwen3-Embedding-0.6B-4bit-DWQ"
dimensions = 1024
timeout = 30
# Leave base_url or model empty to run FTS-only (no vectors, no D2 collision checks).

[search]
rrf_k = 60                        # Reciprocal Rank Fusion constant
fts_seg_fallback = false          # reserved: jieba shadow column if trigram recall is weak

[guard]
title_similarity_threshold = 0.85   # memory_write refuses near-duplicate titles above this
collision_cosine_threshold = 0.86   # D2 observation-collision threshold (cosine)
obs_topk = 5                        # candidates compared per new observation
force_confirm_threshold = 3         # forced bypasses / 24h before force also needs force_confirm

[server]
# HTTP MCP server (`yacmemo-server`). 0.0.0.0 = reachable from any machine on the LAN.
host = "0.0.0.0"
port = 9721
# Server-level state (usage log); relative to the server's working directory.
data_dir = "data"

[webui]
# WebUI/API 登录密码；空 = 不启用鉴权（LAN 信任模式）。
# 启用后 /ui 与 /api 全部需要登录；MCP 端点不受影响（走 identity token）。
# 建议：使用 identity 管理页（可铸 token）时务必配置密码。
password = ""

# ---- Identity（agent+设备双维度专属记忆）----
# MCP 请求携带 token 即表明身份：Authorization: Bearer <device>_<agent>
# （如 r9000x_teleagent；stdio 用环境变量 YACMEMO_TOKEN）。
# token 是确定性拼接，无需注册存储；WebUI 身份页可校验名称并生成配置片段。
# 层级：user 层共享；agents/<agent>/ 平铺文件 = agent 层（跨设备共享）；
# agents/<agent>/<device>/ = 本机专属；不同 identity 互相不可见。
# 未携带 token 的旧配置照常可用 user 层，但 agents/ 区不可见不可写。

[curator]
# Periodic quality review (proposal-only; never auto-applies).
# Point it at your main-model endpoint; runs off-peak via systemd timer.
enabled = false
schedule = "0 4 * * 6"            # reference: systemd timer deploys separately
base_url = "http://m2ultra:11234/v1"
api_key = "sk-your-key"
model = "your-main-model"
max_tokens = 4096
timeout = 300
# journal/audit/ 审计快照保留天数（每周 timer 顺手清理过期文件；0 = 永不清理）
audit_retention_days = 7

# ---- Users (HTTP server) ----
# Each user mounts at /{id}/mcp on the server port; the root directory IS the
# isolation boundary. Agents on any machine add e.g.:
#   http://debsvc.local:9721/yachen/mcp
#
# Optional per-user git identity for memory-repo snapshot commits
# (empty -> [memory].git_user_name/email -> "<id>" / "<id>@yacmemo.com").
# Only applied when the repo has no identity yet; existing config wins.

[[users]]
id = "yachen"
root = "/srv/yacmemo/yachen/memory"
# git_user_name = "王旭晨"
# git_user_email = "wangxc4@chinatelecom.cn"

[[users]]
id = "user2"
root = "/srv/yacmemo/user2/memory"
