[project]
name = "yacmemo"
version = "0.1.0"
description = "Personal memory layer with three-tier extraction and consistency checking"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "lancedb>=0.38.0",
    "pyarrow>=25.0",
    "mcp>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "python-multipart>=0.0.9",
]

[project.scripts]
yacmemo-enhancer = "yacmemo.enhancer:main"
yacmemo-mcp = "yacmemo.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yacmemo"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # allow long lines in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
